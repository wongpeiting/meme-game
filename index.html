<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can You Run the White House TikTok?</title>
<meta name="description" content="You're the new social media editor at the White House. Your boss wants views. The algorithm has preferences. How far will you go?">
<meta property="og:title" content="Can You Run the White House TikTok?">
<meta property="og:description" content="You're the new social media editor at the White House. Your boss wants views. The algorithm has preferences. How far will you go?">
<meta property="og:image" content="https://wongpeiting.github.io/meme-game/media/blink-guy.png">
<meta property="og:url" content="https://wongpeiting.github.io/meme-game/">
<meta property="og:type" content="website">

<meta name="twitter:description" content="You're the new social media editor at the White House. Your boss wants views. The algorithm has preferences. How far will you go?">
<meta name="twitter:image" content="https://wongpeiting.github.io/meme-game/media/blink-guy.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500&family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #fff;
    color: #111;
    font-family: 'Newsreader', serif;
    font-size: clamp(1.05rem, 2.2vw, 1.2rem);
    line-height: 1.8;
    min-height: 100vh;
    transition: background-color 2s ease;
}

/* ===== STATS HUD ===== */
#stats-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    padding: 0.6rem 2rem;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #e5e5e5;
    z-index: 100;
    font-family: 'Inter', sans-serif;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(-100%);
    transition: all 0.6s ease;
}
#stats-bar.visible { opacity: 1; transform: translateY(0); }

.stat { display: flex; align-items: center; gap: 0.5rem; }
.stat-label { color: #999; }
.stat-value {
    color: #111;
    font-size: 0.8rem;
    font-weight: 600;
    min-width: 2rem;
}
.heart { font-size: 0.9rem; letter-spacing: 1px; transition: color 0.3s; }
.heart.filled { color: #ef4444; }
.heart.empty { color: #ddd; }

.level-bar-container { display: flex; align-items: center; gap: 0.5rem; }
#level-bar {
    width: 70px; height: 2px;
    background: #e5e5e5;
    border-radius: 1px;
    overflow: hidden;
}
#level-fill {
    height: 100%; width: 0%;
    border-radius: 1px;
    transition: width 1s cubic-bezier(0.4,0,0.2,1), background-color 1s ease;
    background: #ccc;
}

/* Round indicator */
#round-indicator {
    position: fixed;
    top: 3rem; right: 2rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #bbb;
    opacity: 0;
    transition: opacity 0.5s ease;
    z-index: 99;
}

/* ===== STORY ===== */
#story-container {
    max-width: 580px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 6rem;
    min-height: 100vh;
}

.passage { margin-bottom: 2rem; }

.passage p {
    margin-bottom: 1em;
    opacity: 0;
    transform: translateY(5px);
    animation: fadeUp 0.45s ease forwards;
}
.passage p:nth-child(1) { animation-delay: 0s; }
.passage p:nth-child(2) { animation-delay: 0.06s; }
.passage p:nth-child(3) { animation-delay: 0.12s; }
.passage p:nth-child(4) { animation-delay: 0.16s; }
.passage p:nth-child(5) { animation-delay: 0.2s; }
.passage p:nth-child(6) { animation-delay: 0.24s; }
.passage p:nth-child(7) { animation-delay: 0.28s; }
.passage p:nth-child(8) { animation-delay: 0.32s; }
.passage p:nth-child(9) { animation-delay: 0.36s; }
.passage p:nth-child(10) { animation-delay: 0.4s; }
.passage p:nth-child(n+11) { animation-delay: 0.44s; }

@keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
}

/* ===== LINE TYPES ===== */
.line-date {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 1.5em !important;
    padding-bottom: 0.4em;
    border-bottom: 1px solid #e5e5e5;
}

.line-header {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1rem, 2.2vw, 1.15rem);
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #000;
    margin-bottom: 1.2em !important;
}

.line-caption {
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    color: #111;
    padding: 0.5rem 0.8rem;
    background: #f5f5f5;
    border-left: 2px solid #111;
    margin: 0.8em 0 !important;
}

.line-views {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: #111;
    letter-spacing: 0.03em;
}

.line-dialogue {
    color: #000;
}

.line-bullet {
    padding-left: 1.2em;
    text-indent: -1.2em;
    margin-bottom: 0.3em !important;
}
.line-bullet::before {
    content: '\2022\00a0\00a0';
    color: #999;
}

/* ===== TITLE ===== */
.section-title {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 85vh;
    text-align: center;
}

.section-title .line-header {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.5rem, 7vw, 4rem);
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #000;
    margin-bottom: 0.3em !important;
}

/* ===== CHOICES ===== */
#choices {
    margin-top: 2rem;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 0.45s ease 0.5s forwards;
}

.choice-btn {
    display: block;
    width: 100%;
    padding: 0.9rem 1rem;
    margin: 0.4rem 0;
    background: #111;
    color: #fff;
    border: 1px solid #111;
    border-radius: 3px;
    text-align: left;
    font-family: 'Sora', sans-serif;
    font-size: 0.9rem;
    line-height: 1.5;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
}

.choice-btn:hover {
    background: #333;
    border-color: #333;
    color: #fff;
}


/* Endgame continue buttons */
.section-reveal .choice-btn,
.section-endgame .choice-btn,
.section-stats .choice-btn,
.section-kicker .choice-btn,
.section-credits .choice-btn {
    background: #111;
    border: 1px solid #111;
    font-family: 'Sora', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: #fff;
    padding: 0.8rem 1.5rem;
    margin-top: 2rem;
    text-align: center;
    border-radius: 3px;
}
.section-reveal .choice-btn:hover,
.section-endgame .choice-btn:hover,
.section-stats .choice-btn:hover,
.section-kicker .choice-btn:hover {
    background: #333;
    border-color: #333;
    color: #fff;
}

/* ===== PROLOGUE IMAGE ===== */
.section-prologue {
    text-align: center;
}
/* Prologue: center the choices area */
.section-prologue { text-align: center; margin-top: 0 !important; }
.section-prologue p:last-of-type { margin-bottom: 0.3em; }
.section-prologue .choice-btn {
    display: inline-block;
    width: auto;
    text-align: center;
    background: #111;
    color: #fff;
    border-color: #111;
    font-weight: 500;
}
.section-prologue .choice-btn:hover {
    background: #333;
    border-color: #333;
    color: #fff;
}

.prologue-dog {
    max-width: 420px;
    width: 100%;
    margin: 0 auto 0.8rem;
    display: block;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.6s forwards;
}
.section-prologue p {
    text-align: left;
}

/* ===== VIDEO REEL ===== */
.reel {
    margin: 2rem 0;
    text-align: center;
}
.reel-player {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
}
.reel-screen {
    position: relative;
    width: 240px;
    flex-shrink: 0;
    background: #000;
    overflow: hidden;
    border-radius: 12px;
    aspect-ratio: 9/16;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
}
.reel-screen video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.reel-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 3rem 0.8rem 0.7rem;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    color: #fff;
    text-align: left;
}
.reel-handle {
    font-family: 'Inter', sans-serif;
    font-size: 0.6rem;
    font-weight: 600;
    opacity: 0.7;
    margin-bottom: 0.15rem;
}
.reel-caption {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    line-height: 1.3;
}
.reel-views {
    position: absolute;
    top: 0.6rem; left: 0.6rem;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
/* Arrow buttons */
.reel-arrow {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid #ddd;
    background: #fff;
    color: #111;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
}
.reel-arrow:hover { border-color: #111; background: #111; color: #fff; }
.reel-arrow:disabled { border-color: #eee; color: #ccc; cursor: default; background: #fff; }
/* Info below video */
.reel-meta {
    margin-top: 1rem;
}
.reel-counter {
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    color: #999;
    letter-spacing: 0.08em;
}
.reel-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 0.6rem;
}
.reel-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ddd;
    transition: all 0.2s;
    cursor: pointer;
}
.reel-dot.active {
    background: #111;
    transform: scale(1.3);
}

/* ===== BAR CHART ===== */
.chart-container {
    margin: 2rem 0;
    position: relative;
    padding-left: 2rem;
}
.chart-arrow {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.chart-arrow-line {
    width: 1px;
    flex: 1;
    background: #ccc;
    position: relative;
}
.chart-arrow-line::before {
    content: '';
    position: absolute;
    top: 0;
    left: -4px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-bottom: 8px solid #ccc;
}
.chart-arrow-label {
    font-family: 'Inter', sans-serif;
    font-size: 0.5rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #999;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    margin: 0.5rem 0;
    white-space: nowrap;
}
.chart-row {
    display: flex;
    align-items: center;
    height: 32px;
    margin-bottom: 0.4rem;
    opacity: 0;
    animation: fadeUp 0.4s ease forwards;
}
.chart-row:nth-child(1) { animation-delay: 0.1s; }
.chart-row:nth-child(2) { animation-delay: 0.2s; }
.chart-row:nth-child(3) { animation-delay: 0.3s; }
.chart-row:nth-child(4) { animation-delay: 0.4s; }
.chart-row:nth-child(5) { animation-delay: 0.5s; }
.chart-row:nth-child(6) { animation-delay: 0.6s; }
.chart-row:nth-child(7) { animation-delay: 0.7s; }
.chart-label {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: #333;
    width: 110px;
    text-align: right;
    padding-right: 0.8rem;
    flex-shrink: 0;
}
.chart-bar-track {
    flex: 1;
    height: 30px;
    position: relative;
}
.chart-bar {
    height: 100%;
    border-radius: 2px;
    width: 0%;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 0.5rem;
}
.chart-bar.grey { background: #888; }
.chart-bar.red { background: #ef6461; }
.chart-value {
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
}

/* ===== BILLION COUNTER ===== */
.billion-line {
    text-align: center;
    margin: 1.5rem 0 !important;
}
.billion-counter {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 700;
    color: #000;
    display: block;
    line-height: 1.1;
    letter-spacing: -0.02em;
}
.billion-label {
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    display: block;
    margin-top: 0.3rem;
}
@keyframes billionPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
}
.billion-counter.done {
    animation: billionPulse 0.4s ease;
    color: #ef4444;
}

/* ===== EFFECTS ===== */
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-2px); }
    45% { transform: translateX(2px); }
    75% { transform: translateX(-1px); }
}
.shake { animation: shake 0.35s ease; }

/* ===== CREDITS ===== */
.section-credits { text-align: center; }
.section-credits .line-header {
    font-size: clamp(1.5rem, 4vw, 2rem);
    margin-bottom: 1.5em !important;
}
.section-credits p { color: #888; }

.credits-link {
    display: inline-block;
    margin-top: 2rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: #111;
    text-decoration: none;
    border-bottom: 1px solid #ddd;
    padding-bottom: 2px;
    transition: border-color 0.3s ease;
}
.credits-link:hover { border-color: #000; }

/* ===== RESPONSIVE ===== */
@media (max-width: 640px) {
    /* Stats bar */
    #stats-bar { gap: 0.8rem; padding: 0.5rem 0.6rem; font-size: 0.5rem; }
    .stat-value { font-size: 0.65rem; }
    .stat-label { font-size: 0.45rem; }
    .heart { font-size: 0.75rem; }

    /* Story */
    #story-container { padding: 4rem 1rem 4rem; }
    #round-indicator { top: 2.8rem; right: 0.8rem; }

    /* Choices */
    .choice-btn { font-size: 0.85rem; padding: 0.8rem 1rem; }

    /* Reel */
    .reel-player { gap: 0.6rem; }
    .reel-screen { width: 180px; }
    .reel-arrow { width: 36px; height: 36px; font-size: 1rem; }
    .reel-dot { width: 5px; height: 5px; }

    /* Bar chart */
    .chart-container { padding-left: 1.5rem; }
    .chart-label { width: 70px; font-size: 0.6rem; padding-right: 0.5rem; }
    .chart-bar-track { height: 22px; }
    .chart-value { font-size: 0.55rem; }
    .chart-arrow-label { font-size: 0.4rem; }

    /* Prologue */
    .prologue-dog { max-width: 200px; }

    /* Billion counter */
    .billion-counter { font-size: clamp(2rem, 10vw, 3rem); }

    /* Endgame buttons */
    .section-reveal .choice-btn,
    .section-endgame .choice-btn,
    .section-stats .choice-btn,
    .section-kicker .choice-btn,
    .section-credits .choice-btn { font-size: 0.7rem; padding: 0.7rem 1.2rem; }
}
</style>
</head>
<body>

<header id="stats-bar">
    <div class="stat">
        <span class="stat-label">Views</span>
        <span class="stat-value" id="stat-views">0 million</span>
    </div>
    <div class="stat">
        <span class="stat-label">Packaging</span>
        <span class="stat-value" id="stat-level">Official</span>
    </div>
    <div class="stat">
        <span class="stat-label">Boss Approval</span>
        <span class="stat-value" id="stat-boss">
            <span class="heart filled">&#9829;</span><span class="heart filled">&#9829;</span><span class="heart filled">&#9829;</span><span class="heart empty">&#9829;</span><span class="heart empty">&#9829;</span>
        </span>
    </div>
</header>

<div id="round-indicator"></div>

<main id="story-container">
    <div id="story-text"></div>
    <div id="choices"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/inkjs@2.2.2/dist/ink.min.js"></script>
<script src="peak_meme.js"></script>

<script>
(function() {
    var story = new inkjs.Story(storyContent);
    var storyText = document.getElementById('story-text');
    var choicesEl = document.getElementById('choices');
    var statsBar = document.getElementById('stats-bar');
    var roundIndicator = document.getElementById('round-indicator');
    var currentSection = '';
    var statsVisible = false;

    continueStory();

    function continueStory() {
        var lines = [];
        var allTags = [];
        var effects = [];

        while (story.canContinue) {
            var text = story.Continue().trim();
            var tags = story.currentTags.slice();
            if (text) lines.push({ text: text, tags: tags });

            tags.forEach(function(tag) {
                var t = tag.trim();
                allTags.push(t);
                if (t.indexOf('effect:') === 0) effects.push(t.split(':')[1].trim());
                if (t.indexOf('section:') === 0) currentSection = t.split(':')[1].trim();
                if (t.indexOf('round:') === 0) {
                    roundIndicator.textContent = 'Round ' + t.split(':')[1].trim() + ' / 7';
                    roundIndicator.style.opacity = '1';
                }
            });
        }

        if (currentSection === 'round' && !statsVisible) {
            statsVisible = true;
            statsBar.classList.add('visible');
        }

        if (['endgame','stats','reveal','kicker','credits'].indexOf(currentSection) >= 0) {
            roundIndicator.style.opacity = '0';
        }

        renderPassage(lines);
        renderChoices();
        if (statsVisible) updateStats();

        effects.forEach(function(e) {
            if (e === 'shake') setTimeout(triggerShake, 300);
        });

        applyEscalation();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPassage(lines) {
        storyText.innerHTML = '';
        var passage = document.createElement('div');
        passage.className = 'passage';
        if (currentSection) passage.classList.add('section-' + currentSection);

        lines.forEach(function(line) {
            var p = document.createElement('p');
            line.tags.forEach(function(tag) {
                var t = tag.trim();
                if (t === 'date') p.classList.add('line-date');
                if (t === 'header') p.classList.add('line-header');
                if (t === 'caption') p.classList.add('line-caption');
                if (t === 'views') p.classList.add('line-views');
                if (t === 'image') p.dataset.hasImage = 'true';
                if (t === 'bold') p.style.fontWeight = '700';
                if (t === 'afterchart') p.dataset.afterchart = 'true';
            });
            if (/^[\u201c"]/.test(line.text) && !p.classList.contains('line-caption')) {
                p.classList.add('line-dialogue');
            }
            // Bullet points: detect date-prefixed lines (Jan/Feb/Mar/etc)
            var txt = line.text;
            var dateMatch = txt.match(/^((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2},\s+\d{4}:)\s*(.*)/);
            if (dateMatch) {
                p.classList.add('line-bullet');
                p.innerHTML = '<strong>' + dateMatch[1] + '</strong> ' + dateMatch[2];
            }
            // Special: billion counter
            else if (txt.indexOf('1.45 billion') >= 0) {
                p.classList.add('billion-line');
                p.innerHTML = '<span class="billion-counter" id="billion-counter">0</span><span class="billion-label">views across 600 posts</span>';
                setTimeout(function() { animateBillion(); }, 400);
            }
            // Bold specific labels
            else if (/^(Packaging peak:|Total views:)/.test(txt)) {
                var parts = txt.split(':');
                p.innerHTML = '<strong>' + parts[0] + ':</strong>' + parts.slice(1).join(':');
            } else if (txt.indexOf('Restricted Mode') >= 0) {
                p.innerHTML = txt.replace('Restricted Mode', '<a href="https://www.tiktok.com/support/faq_detail?id=7543604784121731590&category=web_account" target="_blank" style="color:#111;text-decoration:underline;">Restricted Mode</a>');
            } else {
                p.textContent = txt;
            }
            // Re-apply bullet text after content is set
            if (p.classList.contains('line-bullet') && p.textContent) {
                // textContent already set to stripped text
            }
            passage.appendChild(p);

        });

        storyText.appendChild(passage);

        // Build bar chart, then append afterchart text below it
        if (currentSection === 'chart') {
            // Pull out afterchart paragraphs
            var afterChartPs = passage.querySelectorAll('[data-afterchart]');
            var held = [];
            afterChartPs.forEach(function(p) {
                held.push(p);
                p.remove();
            });
            buildChart(storyText);
            // Append held paragraphs after chart
            held.forEach(function(p) {
                storyText.appendChild(p);
            });
        }

        // Build video reel for the reel section
        if (currentSection === 'reel') {
            buildReel(storyText);
        }
    }

    function renderChoices() {
        choicesEl.innerHTML = '';
        choicesEl.style.animation = 'none';
        void choicesEl.offsetHeight;
        choicesEl.style.animation = '';
        choicesEl.className = '';
        if (currentSection) choicesEl.classList.add('section-' + currentSection);

        if (currentSection === 'credits') {
            return;
        }

        // "Read the full investigation" links directly to the scrolly
        var hasInvestigationLink = false;
        story.currentChoices.forEach(function(choice) {
            if (choice.text.indexOf('Read the full investigation') >= 0) {
                hasInvestigationLink = true;
            }
        });
        if (hasInvestigationLink) {
            story.currentChoices.forEach(function(choice) {
                var link = document.createElement('a');
                link.href = 'https://wongpeiting.github.io/peak-meme/';
                link.target = '_blank';
                link.className = 'choice-btn';
                link.textContent = choice.text;
                link.style.textAlign = 'center';
                link.style.textDecoration = 'none';
                link.style.display = 'block';
                choicesEl.appendChild(link);
            });
            return;
        }

        story.currentChoices.forEach(function(choice, i) {
            var btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = choice.text;
            btn.addEventListener('click', function() {
                story.ChooseChoiceIndex(i);
                continueStory();
            });
            choicesEl.appendChild(btn);
        });

        // Insert dog meme above the button on prologue
        if (currentSection === 'prologue') {
            var img = document.createElement('img');
            img.src = 'media/blink-guy.png';
            img.alt = 'This is fine.';
            img.className = 'prologue-dog';
            choicesEl.insertBefore(img, choicesEl.firstChild);
        }
    }

    function updateStats() {
        var views = story.variablesState['total_views'];
        var peak = story.variablesState['packaging_peak'];
        var boss = story.variablesState['boss_approval'];

        animateValue(document.getElementById('stat-views'),
            parseInt(document.getElementById('stat-views').textContent) || 0, views, 800, ' million');

        var cl = story.variablesState['current_level'];
        var levelNames = ['Official', 'Official', 'Direct address', 'Cinematic', 'TikTok-native', 'Pop culture', 'Meme', 'Gamified'];
        document.getElementById('stat-level').textContent = levelNames[cl] || 'Official';
        document.getElementById('stat-level').style.color = getLevelColor(cl);
        // Boss hearts: map 0-100 to 0-5 filled hearts
        var filledHearts = Math.round(boss / 20);
        filledHearts = Math.max(0, Math.min(5, filledHearts));
        var heartsHtml = '';
        for (var h = 0; h < 5; h++) {
            heartsHtml += '<span class="heart ' + (h < filledHearts ? 'filled' : 'empty') + '">\u2665</span>';
        }
        document.getElementById('stat-boss').innerHTML = heartsHtml;
    }

    function animateValue(el, start, end, dur, suffix) {
        if (start === end) return;
        var t0 = null;
        function step(ts) {
            if (!t0) t0 = ts;
            var p = Math.min((ts - t0) / dur, 1);
            el.textContent = Math.round(start + (end - start) * (1 - Math.pow(1-p, 3))) + suffix;
            if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    function getLevelColor(l) {
        if (l <= 0) return '#ccc';
        if (l <= 2) return '#999';
        if (l <= 4) return '#555';
        if (l <= 6) return '#ef4444';
        return '#dc2626';
    }

    function applyEscalation() {
        var peak = story.variablesState['packaging_peak'];
        // Subtle warm tint at high levels
        if (peak >= 5) {
            var warmth = Math.min((peak - 4) * 3, 10);
            document.body.style.backgroundColor =
                'rgb(' + (255) + ',' + (255 - warmth) + ',' + (255 - warmth * 2) + ')';
        }
    }

    // ===== BAR CHART =====
    var chartData = [
        { label: 'Official', value: 1.3, color: 'grey' },
        { label: 'Direct address', value: 2.1, color: 'grey' },
        { label: 'Produced', value: 1.9, color: 'grey' },
        { label: 'TikTok-native', value: 3.2, color: 'grey' },
        { label: 'Pop culture', value: 3.1, color: 'red' },
        { label: 'Meme', value: 4.9, color: 'red' },
        { label: 'Gamified', value: 5.9, color: 'red' }
    ];

    function buildChart(container) {
        var maxVal = 5.9;
        var chart = document.createElement('div');
        chart.className = 'chart-container';

        // Arrow
        var arrow = document.createElement('div');
        arrow.className = 'chart-arrow';
        arrow.innerHTML = '<div class="chart-arrow-line"></div><div class="chart-arrow-label">Level of escalation</div>';
        chart.appendChild(arrow);

        // Bars (bottom to top = official to gamified, so reverse)
        var bars = document.createElement('div');
        for (var i = chartData.length - 1; i >= 0; i--) {
            var d = chartData[i];
            var row = document.createElement('div');
            row.className = 'chart-row';
            row.style.animationDelay = ((chartData.length - 1 - i) * 0.1 + 0.2) + 's';

            row.innerHTML = '<div class="chart-label">' + d.label + '</div>'
                + '<div class="chart-bar-track"><div class="chart-bar ' + d.color + '" id="bar-' + i + '"><span class="chart-value">' + d.value + 'M</span></div></div>';
            bars.appendChild(row);
        }
        chart.appendChild(bars);
        container.appendChild(chart);

        // Animate bars after a short delay
        setTimeout(function() {
            for (var i = 0; i < chartData.length; i++) {
                var bar = document.getElementById('bar-' + i);
                if (bar) {
                    bar.style.width = (chartData[i].value / maxVal * 100) + '%';
                }
            }
        }, 400);
    }

    // ===== VIDEO REEL =====
    var reelPosts = [
        { file: 'media/iran-nuclear.mp4', caption: '"Iran can never have a nuclear weapon"', views: '9.8M views' },
        { file: 'media/stay-frosty.mp4', caption: '"Stay frosty"', views: '12M views' },
        { file: 'media/hunted-hunter.mp4', caption: '"I was the hunted, now I\'m the hunter"', views: '3.7M views' },
        { file: 'media/boom-boom.mp4', caption: '"\ud83d\udca5\ud83d\udca5"', views: '2M views' },
        { file: 'media/message-to-terrorists.mp4', caption: '"A message to terrorists"', views: '12.9M views' },
        { file: 'media/locked-in.mp4', caption: '"LOCKED IN"', views: '3.9M views' },
        { file: 'media/home-run.mp4', caption: '"HOME RUN"', views: '4M views' },
        { file: 'media/touchdown.mp4', caption: '"TOUCHDOWN"', views: '2.7M views' },
        { file: 'media/justice.mp4', caption: '"Justice the American way"', views: '4.1M views' },
        { file: 'media/coming-in-hot.mp4', caption: '"Coming in hot"', views: '7M views' },
        { file: 'media/undefeated.mp4', caption: '"UNDEFEATED"', views: '1.4M views' },
        { file: 'media/strike.mp4', caption: '"STRIKE"', views: '6.3M views' }
    ];
    var reelIndex = 0;

    function buildReel(container) {
        var reel = document.createElement('div');
        reel.className = 'reel';

        // Player: prev + video + next
        var player = '<div class="reel-player">'
            + '<button class="reel-arrow" id="reel-prev">\u2190</button>'
            + '<div class="reel-screen">'
            + '<video id="reel-video" playsinline autoplay muted loop></video>'
            + '<div class="reel-views" id="reel-views"></div>'
            + '<div class="reel-overlay">'
            + '<div class="reel-handle">@whitehouse</div>'
            + '<div class="reel-caption" id="reel-caption"></div>'
            + '</div></div>'
            + '<button class="reel-arrow" id="reel-next">\u2192</button>'
            + '</div>';

        // Meta: counter + dots
        var dots = '<div class="reel-meta"><div class="reel-counter" id="reel-counter"></div><div class="reel-dots" id="reel-dots">';
        for (var d = 0; d < reelPosts.length; d++) {
            dots += '<div class="reel-dot" data-index="' + d + '"></div>';
        }
        dots += '</div></div>';

        reel.innerHTML = player + dots;
        container.appendChild(reel);

        // Dot click handlers
        document.querySelectorAll('.reel-dot').forEach(function(el) {
            el.addEventListener('click', function() {
                reelIndex = parseInt(this.dataset.index);
                updateReel();
            });
        });

        document.getElementById('reel-prev').addEventListener('click', function() {
            reelIndex = Math.max(0, reelIndex - 1);
            updateReel();
        });
        document.getElementById('reel-next').addEventListener('click', function() {
            reelIndex = Math.min(reelPosts.length - 1, reelIndex + 1);
            updateReel();
        });
        reelIndex = 0;
        updateReel();
    }

    function updateReel() {
        var post = reelPosts[reelIndex];
        var video = document.getElementById('reel-video');
        video.src = post.file;
        video.load();
        video.play();
        document.getElementById('reel-caption').textContent = post.caption;
        document.getElementById('reel-views').textContent = post.views;
        document.getElementById('reel-counter').textContent = (reelIndex + 1) + ' of ' + reelPosts.length;
        document.getElementById('reel-prev').disabled = reelIndex === 0;
        document.getElementById('reel-next').disabled = reelIndex === reelPosts.length - 1;

        // Update dots
        document.querySelectorAll('.reel-dot').forEach(function(el, i) {
            el.classList.toggle('active', i === reelIndex);
        });
    }

    // ===== BILLION COUNTER =====
    function animateBillion() {
        var el = document.getElementById('billion-counter');
        if (!el) return;
        var target = 1453171000;
        var duration = 2500;
        var startTime = null;
        var shaken = false;

        function step(ts) {
            if (!startTime) startTime = ts;
            var progress = Math.min((ts - startTime) / duration, 1);
            // Ease out cubic
            var eased = 1 - Math.pow(1 - progress, 3);
            var current = Math.round(target * eased);
            el.textContent = current.toLocaleString();

            // Shake at 80%
            if (progress > 0.8 && !shaken) {
                shaken = true;
                triggerShake();
            }

            if (progress < 1) {
                requestAnimationFrame(step);
            } else {
                el.textContent = '1,453,171,000';
                el.classList.add('done');
            }
        }
        requestAnimationFrame(step);
    }

    function triggerShake() {
        var el = document.getElementById('story-container');
        el.classList.add('shake');
        setTimeout(function() { el.classList.remove('shake'); }, 350);
    }
})();
</script>
</body>
